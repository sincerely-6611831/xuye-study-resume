plugins { id 'com.android.application' }
android {
    namespace 'cn.xuye.study.wear'
    compileSdk 35
    // Data Layer 要求手表与手机使用相同 applicationId 和签名。
    defaultConfig { applicationId 'cn.xuye.study'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.5.0' }
    signingConfigs {
        release {
            if (System.getenv('XUYE_KEYSTORE')) {
                storeFile file(System.getenv('XUYE_KEYSTORE'))
                storePassword System.getenv('XUYE_SIGN_PASSWORD')
                keyAlias 'xuye-release'
                keyPassword System.getenv('XUYE_SIGN_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('XUYE_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:19.0.0' }

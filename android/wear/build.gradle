plugins { id 'com.android.application' }
android {
    namespace 'cn.xuye.study.wear'
    compileSdk 35
    // Data Layer 要求手表与手机使用相同 applicationId 和签名。
    defaultConfig { applicationId 'cn.xuye.study'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.4.0' }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:19.0.0' }
